services:
  temporal:
    build:
      context: .
      dockerfile: temporal-dev.Dockerfile
    container_name: hoo-temporal
    ports:
      - "7233:7233"
      - "8080:8233"
    command:
      - server
      - start-dev
      - --ip
      - "0.0.0.0"
      - --port
      - "7233"
      - --ui-ip
      - "0.0.0.0"
      - --ui-port
      - "8233"
      - --namespace
      - default
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hoo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: hoo-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=hotel-offers
      - SUPPLIER_A_URL=http://app:3000/supplierA/hotels
      - SUPPLIER_B_URL=http://app:3000/supplierB/hotels
      - SUPPLIER_A_DOWN=${SUPPLIER_A_DOWN:-false}
      - SUPPLIER_B_DOWN=${SUPPLIER_B_DOWN:-false}
      - PARTIAL_CACHE_TTL_SECONDS=${PARTIAL_CACHE_TTL_SECONDS:-30}
      - LOG_LEVEL=info
      - CACHE_TTL_SECONDS=300
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 || r.statusCode === 503 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: hoo-worker
    command: ["node", "dist/src/temporal/worker.js"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=hotel-offers
      - SUPPLIER_A_URL=http://app:3000/supplierA/hotels
      - SUPPLIER_B_URL=http://app:3000/supplierB/hotels
      - SUPPLIER_A_DOWN=${SUPPLIER_A_DOWN:-false}
      - SUPPLIER_B_DOWN=${SUPPLIER_B_DOWN:-false}
      - PARTIAL_CACHE_TTL_SECONDS=${PARTIAL_CACHE_TTL_SECONDS:-30}
      - LOG_LEVEL=info
      - CACHE_TTL_SECONDS=300
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped
