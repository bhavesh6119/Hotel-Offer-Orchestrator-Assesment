version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: hoo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.24
    container_name: hoo-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=sqlite
    depends_on:
      redis:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: hoo-temporal-ui
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  app:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: hoo-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=hotel-offers
      - SUPPLIER_A_URL=http://localhost:3000/supplierA/hotels
      - SUPPLIER_B_URL=http://localhost:3000/supplierB/hotels
      - LOG_LEVEL=info
      - CACHE_TTL_SECONDS=300
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: unless-stopped
